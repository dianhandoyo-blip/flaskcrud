{% extends 'base.html' %}

{% block judul %}
Ubah Data Mahasiswa
{% endblock %}

{% block JudulKonten %}
<h3 class="box-title">Ubah Data Mahasiswa</h3>
{% endblock %}

{% block konten %}

<form action="{{ url_for('proses_ubah') }}" method="POST">

    <div class="form-group">
        <label>No Induk Mahasiswa</label>
        <input type="hidden" name="nim_ori" value="{{ hasil.0 }}">
        <input type="text" name="nim" class="form-control" value="{{ hasil.0 }}">
    </div>

    <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" name="nama" class="form-control" value="{{ hasil.1 }}">
    </div>

    <div class="form-group">
        <label>Asal</label>
        <input type="text" name="asal" class="form-control" value="{{ hasil.2 }}">
    </div>

    <div class="box-footer">
        <button type="reset" class="btn btn-default">Cancel</button>
        <button type="submit" class="btn btn-primary pull-right">Submit</button>
    </div>

</form>

{% endblock %}
